name: Daily Briefing

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest without sending Telegram"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
      TIMEZONE: Asia/Seoul
      DIGEST_DAYS: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Restore Codex auth
        run: |
          test -n "$CODEX_AUTH_JSON"
          codex_home="$RUNNER_TEMP/codex-home"
          mkdir -p "$codex_home"
          printf '%s' "$CODEX_AUTH_JSON" > "$codex_home/auth.json"
          chmod 600 "$codex_home/auth.json"
          echo "CODEX_HOME=$codex_home" >> "$GITHUB_ENV"

      - name: Verify required secrets
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"

      - name: Run daily briefing
        run: ./run.sh
